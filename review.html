<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rate PDF Dark Mode — Extension Review</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#07090c" />
  <link rel="canonical" href="https://pdf-dark.com/review.html" />
  <link rel="icon" type="image/png" href="./assets/logo.png" />
  <style>
    :root {
      --bg: #07090c;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #508b5e;
      --accent-hover: #5ea36e;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: block;
      border-radius: 14px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      font-weight: 700;
    }

    p {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: var(--accent);
      border-color: transparent;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .support-footer {
      margin-top: 24px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .support-footer a {
      color: #93c5fd;
      text-decoration: none;
    }

    .support-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./assets/logo.png" alt="PDF Dark Mode" class="logo" />
    <div id="loadingSpinner" class="spinner" aria-hidden="true"></div>
    <h1 id="statusHeading">Redirecting to store review…</h1>
    <p id="statusCopy">
      Taking you to the extension review page. If you are not redirected automatically, select your browser below:
    </p>

    <div class="actions">
      <a
        id="chromeLink"
        class="btn btn-primary"
        href="https://chromewebstore.google.com/detail/pdf-dark-mode/clabimobhdkbfpkdeloigeneocldkmdc/reviews"
        target="_blank"
        rel="noopener noreferrer"
      >
        ⭐ Rate on Chrome Web Store
      </a>
      <a
        id="edgeLink"
        class="btn"
        href="https://microsoftedge.microsoft.com/addons/detail/pdf-dark-mode/nghkmkbjhpgdibgopgekgjnbocfmnjdo"
        target="_blank"
        rel="noopener noreferrer"
      >
        Rate on Microsoft Edge Add-ons
      </a>
    </div>

    <div class="support-footer">
      Experiencing a problem? <a href="./help.html">Contact Support</a> instead.
    </div>
  </div>

  <script>
    (function () {
      const CHROME_STORE_URL =
        "https://chromewebstore.google.com/detail/pdf-dark-mode/clabimobhdkbfpkdeloigeneocldkmdc/reviews";
      const EDGE_STORE_URL =
        "https://microsoftedge.microsoft.com/addons/detail/pdf-dark-mode/nghkmkbjhpgdibgopgekgjnbocfmnjdo";

      const params = new URLSearchParams(window.location.search);
      const forcedBrowser = (params.get("browser") || "").toLowerCase();

      function detectIsEdge() {
        if (forcedBrowser === "edge") return true;
        if (forcedBrowser === "chrome") return false;

        const ua = navigator.userAgent || "";
        if (/Edg\//i.test(ua)) return true;

        if (navigator.userAgentData && Array.isArray(navigator.userAgentData.brands)) {
          return navigator.userAgentData.brands.some((b) => /edge/i.test(b.brand));
        }

        return false;
      }

      const isEdge = detectIsEdge();
      const targetUrl = isEdge ? EDGE_STORE_URL : CHROME_STORE_URL;
      const targetName = isEdge ? "Microsoft Edge Add-ons" : "Chrome Web Store";

      const heading = document.getElementById("statusHeading");
      if (heading) {
        heading.textContent = "Redirecting to " + targetName + "…";
      }

      const edgeBtn = document.getElementById("edgeLink");
      const chromeBtn = document.getElementById("chromeLink");
      if (isEdge && edgeBtn && chromeBtn) {
        edgeBtn.classList.add("btn-primary");
        chromeBtn.classList.remove("btn-primary");
      }

      // Small delay so the user sees the confirmation before the tab navigates
      setTimeout(function () {
        try {
          window.location.replace(targetUrl);
        } catch {
          window.location.href = targetUrl;
        }
      }, 400);
    })();
  </script>
</body>
</html>
